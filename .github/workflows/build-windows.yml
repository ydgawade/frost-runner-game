name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller

      - name: Build single-file EXE
        run: pyinstaller --onefile --windowed --name FrostRunner --distpath dist FrostRunner.py

      - name: Verify the EXE exists
        shell: pwsh
        run: |
          if (!(Test-Path dist/FrostRunner.exe)) { throw "Build failed - no exe produced" }
          $size = (Get-Item dist/FrostRunner.exe).Length / 1MB
          Write-Host ("FrostRunner.exe built OK - {0:N1} MB" -f $size)

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrostRunner-Windows-EXE
          path: dist/FrostRunner.exe
          retention-days: 90

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Frost Runner v1.0.${{ github.run_number }}
          body: |
            **Frost Runner - Princess Aria**

            Download `FrostRunner.exe` below and double-click it. No Python needed.

            Controls: SPACE / UP ARROW / MOUSE CLICK = Jump, ESC = Pause, ENTER = Start
          files: dist/FrostRunner.exe
